game:
  fps: 60
  window:
    width: 1280
    height: 720
  extra_life_every: 10000
  starting_lives: 3
  rng_seed: null

controls:
  rotate_left: ["LEFT", "A"]
  rotate_right: ["RIGHT", "D"]
  thrust: ["UP", "W"]
  fire: ["SPACE", "LCONTROL"]
  hyperspace: ["LSHIFT"]
  pause: ["P"]
  start: ["RETURN"]
  quit: ["ESCAPE"]

ship:
  radius: 14
  turn_rate_deg_per_s: 220
  thrust_px_per_s2: 260
  max_speed_px_per_s: 380
  respawn_invuln_s: 2.0
  hyperspace_cooldown_s: 3.0
  hyperspace_fail_chance: 0.08
  wrap_margin_px: 16

bullet:
  speed_px_per_s: 520
  lifetime_s: 1.35
  fire_rate_per_s: 6.5
  pool_size: 8
  radius: 2

asteroids:
  sizes:
    - name: large
      radius: 48
      speed_px_per_s: [40, 70]
      fragments: 2
      score: 20
    - name: medium
      radius: 28
      speed_px_per_s: [60, 100]
      fragments: 2
      score: 50
    - name: small
      radius: 16
      speed_px_per_s: [90, 140]
      fragments: 0
      score: 100
  spawn:
    base_count: 4
    count_growth: 1
    speed_scale_per_wave: 0.06
    safe_spawn_radius_px: 140

saucer:
  max_active: 1
  spawn_delay_s: [5.0, 8.0]
  spawn_interval_s: [7.0, 12.0]
  small_chance_by_wave: [0.0, 0.2, 0.6, 0.7, 0.8]
  prefer_small_if_score_ge: 40000

  large:
    radius: 18
    speed_px_per_s: 120
    fire_cooldown_s: [1.1, 1.6]
    bullet_speed_px_per_s: 360
    aim_error_deg_sigma: [25, 40]
    lifetime_s: [8.0, 12.0]
    score: 200
  small:
    radius: 14
    speed_px_per_s: 160
    fire_cooldown_s: [0.8, 1.2]
    bullet_speed_px_per_s: 420
    aim_error_deg_sigma: [4, 10]
    min_error_floor_deg: 4
    lifetime_s: [10.0, 14.0]
    score: 1000

scoring:
  large_asteroid: 20
  medium_asteroid: 50
  small_asteroid: 100
  saucer_large: 200
  saucer_small: 1000

ui:
  show_fps: false
  hud_margin_px: 12
